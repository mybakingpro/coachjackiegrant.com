        const { error: e } = await supabase.auth.signUp({ email, password: pass, options: { data: { full_name: name } } });

        const { error: e } = await supabase.auth.signInWithPassword({ email, password: pass });

function App() {
  const [lang, setLang] = useState("es");
  const t = T[lang];
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  const [authReady, setAuthReady] = useState(false);
  const [orders, setOrders] = useState([]);
  const [loadingOrders, setLoadingOrders] = useState(false);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");
  const now = new Date();
  const [calYear, setCalYear] = useState(now.getFullYear());
  const [calMonth, setCalMonth] = useState(now.getMonth());
  const [selDay, setSelDay] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [form, setForm] = useState({});
  const today = todayStr();
  const minYear = now.getFullYear(); const minMonth = now.getMonth();
  const maxYear = now.getFullYear()+2; const maxMonth = now.getMonth();

  useEffect(() => {
    supabase.auth.getSession().then(({ data: { session } }) => { setSession(session); setAuthReady(true); });
    const { data: { subscription } } = supabase.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (!session) return;
    supabase.from("profiles").select("*").eq("id", session.user.id).single()
      .then(({ data }) => { if (data) { setProfile(data); if (data.lang) setLang(data.lang); } });
  }, [session]);

  const loadOrders = useCallback(async () => {
    if (!session) return;
    setLoadingOrders(true); setError("");
    const { data, error: e } = await supabase.from("orders").select("*").eq("user_id", session.user.id).order("due_date", { ascending: true });
    if (e) setError(t.errorLoad); else setOrders(data || []);
    setLoadingOrders(false);
  }, [session, t.errorLoad]);

  useEffect(() => { loadOrders(); }, [loadOrders]);

  async function saveLang(l) {
    setLang(l);
    if (session) await supabase.from("profiles").update({ lang: l }).eq("id", session.user.id);
  }

  const canGoPrev = !(calYear===minYear && calMonth===minMonth);
  const canGoNext = !(calYear===maxYear && calMonth===maxMonth);
  function prevMo(){ if(!canGoPrev) return; if(calMonth===0){setCalMonth(11);setCalYear(y=>y-1);}else setCalMonth(m=>m-1); setSelDay(null); }
  function nextMo(){ if(!canGoNext) return; if(calMonth===11){setCalMonth(0);setCalYear(y=>y+1);}else setCalMonth(m=>m+1); setSelDay(null); }
  function goToday(){ setCalYear(now.getFullYear()); setCalMonth(now.getMonth()); setSelDay(now.getDate()); }
  function ordersOnDay(d){ const ds=dateStr(calYear,calMonth,d); return orders.filter(o=>o.due_date===ds); }

  const selOrders = selDay ? ordersOnDay(selDay) : [];
  const selDateStr = selDay ? dateStr(calYear,calMonth,selDay) : "";

  function openNew(){ setForm({customer:"",phone:"",item:"",category:t.categories[0],quantity:1,time:"",type:"Pickup",status:t.statuses[0],notes:""}); setEditingId(null); setShowForm(true); }
  function openEdit(o){ setForm({customer:o.customer,phone:o.phone||"",item:o.item,category:o.category,quantity:o.quantity,time:o.time||"",type:o.type,status:o.status,notes:o.notes||""}); setEditingId(o.id); setShowForm(true); }

  async function saveForm(){
    if(!form.customer||!form.item||!session) return;
    setSaving(true); setError("");
    const record = { user_id:session.user.id, customer:form.customer, phone:form.phone||"", item:form.item, category:form.category, quantity:form.quantity||1, due_date:selDateStr||today, time:form.time||"", type:form.type, status:form.status, notes:form.notes||"" };
    let e;
    if(editingId){ ({error:e} = await supabase.from("orders").update(record).eq("id",editingId)); }
    else { ({error:e} = await supabase.from("orders").insert(record)); }
    if(e) setError(t.errorSave); else { await loadOrders(); setShowForm(false); }
    setSaving(false);
  }

  async function delOrder(id){ setSaving(true); await supabase.from("orders").delete().eq("id",id); await loadOrders(); setShowForm(false); setSaving(false); }

  const calDaysCount = getDays(calYear,calMonth);
  const calFirst = getFirst(calYear,calMonth);
  const calCells = [...Array(calFirst).fill(null),...Array.from({length:calDaysCount},(_,i)=>i+1)];
  while(calCells.length%7!==0) calCells.push(null);

  const firstName = profile?.full_name?.split(" ")[0] || session?.user?.email?.split("@")[0] || "Baker";

  if(!authReady) return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:C.cream}}>
      <div style={{textAlign:"center"}}><div style={{fontSize:40,marginBottom:12}}>🎂</div><div style={{color:C.brown,fontSize:16}}>{t.loading}</div></div>
    </div>
  );

  if(!session) return <SignIn lang={lang} setLang={setLang}/>;

  return (
    <div style={{minHeight:"100vh",background:C.cream,color:C.text,display:"flex",flexDirection:"column"}}>

      {/* TOP BAR */}
      <div style={{background:C.brown,padding:"0 20px",display:"flex",alignItems:"center",justifyContent:"space-between",height:56,flexShrink:0,boxShadow:`0 2px 16px rgba(92,52,32,0.3)`,flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:20}}>🎂</span>
          <div>
            <div style={{color:C.pinkLight,fontSize:15,fontWeight:"bold",letterSpacing:0.5,lineHeight:1}}>Sweet ManagerPro</div>
            <div style={{color:C.brownLight,fontSize:9,letterSpacing:1.5,textTransform:"uppercase"}}>Free Edition</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          {["es","en"].map(l=>(
            <button key={l} onClick={()=>saveLang(l)} style={{background:lang===l?"rgba(196,168,130,0.25)":"transparent",color:lang===l?C.cream:C.brownLight,border:`1px solid ${lang===l?C.brownLight+"88":"transparent"}`,borderRadius:20,padding:"3px 12px",fontSize:11,cursor:"pointer",transition:"all 0.2s"}}>
              {l==="es"?"ES":"EN"}
            </button>
          ))}
          <div style={{width:1,height:18,background:`${C.brownLight}44`}}/>
          <span style={{fontSize:12,color:C.brownLight}}>👋 {firstName}</span>
          <button onClick={()=>supabase.auth.signOut()} style={{background:"transparent",border:`1px solid ${C.brownLight}55`,color:C.brownLight,borderRadius:8,padding:"4px 10px",fontSize:11,cursor:"pointer"}}>{t.signout}</button>
        </div>
      </div>

      {/* PROMO STRIP */}
      <div style={{background:`linear-gradient(90deg,${C.pinkDeep},${C.brown})`,padding:"9px 24px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8,flexShrink:0}}>
        <span style={{color:C.pinkLight,fontSize:13}}>✨ {t.promo}</span>
        <a href="https://https://mybakingpro.com" target="_blank" rel="noopener noreferrer" style={{background:C.pinkLight,color:C.brown,borderRadius:20,padding:"5px 16px",fontSize:12,fontWeight:"bold",textDecoration:"none"}}>
          {t.promoBtn}
        </a>
      </div>

      {error&&<div style={{background:"#FDF0F0",borderBottom:"1px solid #F4AAAA",padding:"10px 24px",fontSize:13,color:"#8A1A1A",textAlign:"center"}}>{error}</div>}

      {/* MAIN */}
      <div style={{flex:1,display:"flex",maxWidth:1200,width:"100%",margin:"0 auto",padding:"20px 16px",gap:20,flexWrap:"wrap"}}>

        {/* CALENDAR */}
        <div style={{flex:"1 1 580px",minWidth:0}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14,gap:10}}>
            <button onClick={prevMo} disabled={!canGoPrev} style={{background:canGoPrev?C.white:"transparent",border:`1.5px solid ${canGoPrev?C.creamMid:"transparent"}`,borderRadius:10,padding:"8px 18px",fontSize:16,cursor:canGoPrev?"pointer":"default",color:canGoPrev?C.brown:C.textLight,transition:"all 0.2s",boxShadow:canGoPrev?"0 2px 8px rgba(92,52,32,0.08)":"none"}}>‹</button>
            <div style={{textAlign:"center"}}>
              <div style={{fontSize:22,fontWeight:"bold",color:C.brown}}>{t.months[calMonth]}</div>
              <div style={{fontSize:13,color:C.textMid}}>{calYear}</div>
            </div>
            <button onClick={nextMo} disabled={!canGoNext} style={{background:canGoNext?C.white:"transparent",border:`1.5px solid ${canGoNext?C.creamMid:"transparent"}`,borderRadius:10,padding:"8px 18px",fontSize:16,cursor:canGoNext?"pointer":"default",color:canGoNext?C.brown:C.textLight,transition:"all 0.2s",boxShadow:canGoNext?"0 2px 8px rgba(92,52,32,0.08)":"none"}}>›</button>
          </div>
          <div style={{textAlign:"center",marginBottom:12}}>
            <button onClick={goToday} style={{background:"transparent",border:`1px solid ${C.brownLight}`,borderRadius:20,padding:"4px 16px",fontSize:12,color:C.brownMid,cursor:"pointer"}}>◉ {t.today}</button>
          </div>
          {loadingOrders?(
            <div style={{textAlign:"center",padding:"60px 0",color:C.textMid}}>{t.loading}</div>
          ):(
            <div style={{background:C.white,borderRadius:18,overflow:"hidden",boxShadow:"0 4px 24px rgba(92,52,32,0.09)",border:`1px solid ${C.creamMid}`}}>
              <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",background:C.brown}}>
                {t.days.map(d=><div key={d} style={{textAlign:"center",padding:"10px 0",fontSize:11,color:C.pinkLight,fontWeight:"bold",letterSpacing:0.8}}>{d}</div>)}
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:1,background:C.creamMid}}>
                {calCells.map((day,i)=>{
                  if(!day) return <div key={i} style={{background:C.cream,minHeight:82}}/>;
                  const ds=dateStr(calYear,calMonth,day);
                  const isToday=ds===today, isSel=selDay===day;
                  const dos=ordersOnDay(day), isPast=ds<today;
                  return (
                    <div key={i} onClick={()=>setSelDay(isSel?null:day)}
                      style={{background:isSel?C.brown:isToday?C.pinkPale:C.white,minHeight:82,padding:"8px 8px 6px",cursor:"pointer",borderTop:isToday?`3px solid ${C.pink}`:"none",transition:"background 0.15s",opacity:isPast&&!isToday?0.72:1}}
                      onMouseEnter={e=>{if(!isSel)e.currentTarget.style.background=C.pinkPale;}}
                      onMouseLeave={e=>{e.currentTarget.style.background=isSel?C.brown:isToday?C.pinkPale:C.white;}}>
                      <div style={{fontSize:13,fontWeight:isToday?"bold":"normal",color:isSel?C.pinkLight:isToday?C.pinkDeep:C.text,marginBottom:4,display:"flex",alignItems:"center",gap:4}}>
                        {day}{isToday&&<span style={{fontSize:8,background:C.pink,color:C.white,borderRadius:4,padding:"1px 4px",fontWeight:"bold"}}>HOY</span>}
                      </div>
                      {dos.slice(0,3).map(o=>(
                        <div key={o.id} style={{display:"flex",alignItems:"center",gap:3,marginBottom:2}}>
                          <span style={{width:6,height:6,borderRadius:"50%",background:SDOT[o.status]||C.pink,flexShrink:0,display:"inline-block"}}/>
                          <span style={{fontSize:9,color:isSel?C.brownLight:C.textMid,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",maxWidth:"calc(100% - 10px)"}}>{o.customer.split(" ")[0]}</span>
                        </div>
                      ))}
                      {dos.length>3&&<div style={{fontSize:9,color:isSel?C.brownLight:C.textLight}}>+{dos.length-3}</div>}
                    </div>
                  );
                })}
              </div>
            </div>
          )}
          <div style={{display:"flex",flexWrap:"wrap",gap:12,marginTop:14,padding:"0 4px"}}>
            {t.statuses.map(s=>(
              <div key={s} style={{display:"flex",alignItems:"center",gap:5}}>
                <span style={{width:8,height:8,borderRadius:"50%",background:SDOT[s],display:"inline-block"}}/>
                <span style={{fontSize:11,color:C.textMid}}>{s}</span>
              </div>
            ))}
          </div>
        </div>

        {/* SIDE PANEL */}
        <div style={{flex:"0 0 300px",display:"flex",flexDirection:"column",gap:14}}>
          {selDay?(
            <div style={{background:C.white,borderRadius:16,border:`1px solid ${C.creamMid}`,overflow:"hidden",boxShadow:"0 4px 20px rgba(92,52,32,0.08)"}}>
              <div style={{background:`linear-gradient(135deg,${C.brown},${C.brownMid})`,padding:"14px 18px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                <div>
                  <div style={{color:C.pinkLight,fontSize:15,fontWeight:"bold"}}>{t.months[calMonth]} {selDay}</div>
                  <div style={{color:C.brownLight,fontSize:11,marginTop:2}}>{selOrders.length} {selOrders.length===1?(lang==="es"?"pedido":"order"):(lang==="es"?"pedidos":"orders")}</div>
                </div>
                <button onClick={openNew} style={{background:C.pink,color:C.white,border:"none",borderRadius:10,padding:"7px 14px",fontSize:12,fontWeight:"bold",cursor:"pointer",whiteSpace:"nowrap"}}>{t.addOrder}</button>
              </div>
              <div style={{padding:14,maxHeight:460,overflowY:"auto"}}>
                {selOrders.length===0?(
                  <div style={{textAlign:"center",padding:"28px 12px",color:C.textMid}}>
                    <div style={{fontSize:32,marginBottom:8}}>🧁</div>
                    <div style={{fontSize:13}}>{t.noOrders}</div>
                    <button onClick={openNew} style={{marginTop:14,background:C.pinkPale,color:C.pinkDeep,border:`1px solid ${C.pinkLight}`,borderRadius:10,padding:"8px 18px",fontSize:12,fontWeight:"bold",cursor:"pointer"}}>{t.addOrder}</button>
                  </div>
                ):selOrders.map(o=>(
                  <div key={o.id} onClick={()=>openEdit(o)} style={{background:C.cream,borderRadius:12,padding:"12px 14px",marginBottom:10,cursor:"pointer",borderLeft:`4px solid ${SDOT[o.status]||C.pink}`,transition:"all 0.15s"}}
                    onMouseEnter={e=>e.currentTarget.style.background=C.pinkPale}
                    onMouseLeave={e=>e.currentTarget.style.background=C.cream}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
                      <div style={{fontSize:13,fontWeight:"bold",color:C.brown,lineHeight:1.2}}>{o.customer}</div>
                      <span style={{background:SBG[o.status],color:STXT[o.status],borderRadius:20,padding:"2px 8px",fontSize:10,fontWeight:"bold",whiteSpace:"nowrap",flexShrink:0}}>{o.status}</span>
                    </div>
                    <div style={{fontSize:12,color:C.textMid,marginTop:3}}>{o.item}{o.quantity>1?` × ${o.quantity}`:""}</div>
                    <div style={{fontSize:11,color:C.textLight,marginTop:4,display:"flex",gap:10}}>
                      {o.time&&<span>🕐 {o.time}</span>}
                      <span>{o.type==="Delivery"?"🚗":"🛍"} {o.type}</span>
                    </div>
                    {o.notes&&<div style={{fontSize:11,color:C.textLight,marginTop:4,fontStyle:"italic",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{o.notes}</div>}
                  </div>
                ))}
              </div>
            </div>
          ):(
            <div style={{background:C.white,borderRadius:16,border:`1px solid ${C.creamMid}`,padding:"28px 20px",textAlign:"center",boxShadow:"0 4px 20px rgba(92,52,32,0.08)"}}>
              <div style={{fontSize:36,marginBottom:10}}>📅</div>
              <div style={{fontSize:14,fontWeight:"bold",color:C.brown,marginBottom:6}}>{t.months[calMonth]} {calYear}</div>
              <div style={{fontSize:12,color:C.textMid,lineHeight:1.6}}>{t.clickDay}</div>
            </div>
          )}

          {/* MyBakingPro Promo */}
          <div style={{background:`linear-gradient(140deg,${C.brown},${C.brownMid})`,borderRadius:16,padding:"20px 18px",textAlign:"center",position:"relative",overflow:"hidden"}}>
            <div style={{position:"absolute",top:-30,right:-30,width:100,height:100,borderRadius:"50%",background:`radial-gradient(circle,${C.pink}25 0%,transparent 70%)`,pointerEvents:"none"}}/>
            <div style={{fontSize:20,marginBottom:6}}>⭐</div>
            <div style={{fontSize:14,fontWeight:"bold",color:C.pinkLight,marginBottom:6}}>MyBakingPro</div>
            <div style={{fontSize:12,color:C.brownLight,lineHeight:1.6,marginBottom:14,position:"relative"}}>
              {lang==="es"?"Control de ingresos, inventario, recetas y más para tu negocio.":"Revenue, inventory, recipe costing & more for your business."}
            </div>
            <a href="https://https://mybakingpro.com" target="_blank" rel="noopener noreferrer"
              style={{display:"block",background:`linear-gradient(135deg,${C.pink},${C.pinkDeep})`,color:C.white,borderRadius:10,padding:"9px 20px",fontSize:12,fontWeight:"bold",textDecoration:"none",position:"relative"}}>
              {t.promoBtn}
            </a>
          </div>
        </div>
      </div>

      {/* FOOTER */}
      <div style={{background:C.brown,padding:"14px 24px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8,flexShrink:0}}>
        <div style={{color:C.pinkLight,fontSize:13,fontWeight:"bold"}}>🎂 Sweet ManagerPro</div>
        <div style={{color:C.brownLight,fontSize:12}}>{t.footer}</div>
        <a href="https://coachjackiegrant.com" style={{color:C.brownLight,fontSize:12,textDecoration:"none"}}>coachjackiegrant.com</a>
      </div>

      {showForm&&<OrderModal t={t} form={form} setForm={setForm} onSave={saveForm} onDelete={()=>delOrder(editingId)} onClose={()=>setShowForm(false)} isEdit={!!editingId} saving={saving}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
